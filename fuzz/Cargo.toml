[package]
name = "sos-fuzz"
version = "0.1.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
sos-ai = { path = "../crates/sos-ai" }
sos-analysis = { path = "../crates/sos-analysis" }
sos-core = { path = "../crates/sos-core" }
sos-loader = { path = "../crates/sos-loader" }
sos-rpc = { path = "../crates/sos-rpc" }
sos-types = { path = "../crates/sos-types" }

[[bin]]
name = "elf_analysis"
path = "fuzz_targets/elf_analysis.rs"
test = false
doc = false
bench = false

[[bin]]
name = "loader_state"
path = "fuzz_targets/loader_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_response"
path = "fuzz_targets/model_response.rs"
test = false
doc = false
bench = false

[workspace]
