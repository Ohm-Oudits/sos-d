[package]
name = "sos-replay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
litesvm = [
    "dep:base64",
    "dep:litesvm",
    "dep:solana-account",
    "dep:solana-address",
    "dep:solana-instruction",
    "dep:solana-keypair",
    "dep:solana-message",
    "dep:solana-pubkey",
    "dep:solana-signer",
    "dep:solana-transaction",
    "dep:bincode",
]

[dependencies]
base64 = { version = "0.22", optional = true }
bincode = { version = "1.3.3", optional = true }
litesvm = { version = "=0.13.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-account = { version = "3.4.0", optional = true }
solana-address = { version = "=2.2.0", optional = true }
solana-instruction = { version = "=3.2.0", optional = true }
solana-keypair = { version = "3.1", optional = true }
solana-message = { version = "=3.1.0", optional = true }
solana-pubkey = { version = "3.0.0", optional = true }
solana-signer = { version = "3.0.0", optional = true }
solana-transaction = { version = "=3.1.0", features = ["bincode"], optional = true }
sos-types = { path = "../sos-types" }
sos-solana = { path = "../sos-solana" }
