name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check

      - name: Run workspace tests
        run: cargo test --workspace --all-features

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Compile fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets

  sbpf-fixtures:
    name: SBF fixture build
    if: ${{ vars.SOS_SBF_RUNNER == 'enabled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Require pinned Solana toolchain
        run: |
          test "$(solana --version | awk '{print $2}')" = "3.0.0"
          command -v cargo-build-sbf

      - name: Build fixtures
        run: ./scripts/build-fixtures.sh

      - name: Verify callx fixture analysis
        run: ./scripts/test-callx-fixture.sh

      - name: Run address-first local inspect E2E
        run: ./scripts/test-local-inspect.sh
